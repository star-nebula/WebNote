# 本仓唯一需要机器读的清单：外部技能的来源与代际。
#
# 为什么只有这一段：
#   角色（agents/*.md）、技能路由（skills/*/SKILL.md）、产出格式（runs/_template/）
#   都有自己的发现约定，工具直接按路径读，不需要额外注册文件；
#   而「这份副本来自上游哪一代」没有任何约定能表达，只能显式记下来。
#
# 消费者：tools/check_vendor.py（离线断言 / --online 比对 / --pull 升版）。
# 真源只有这里：上游仓库 + 完整 commit。不要再经由本地第二份副本（如技能库那个同名
# 目录）中转——两份都要维护，漏一份就会被镜像回旧版。
schema: 1

name: WebNote

vendored:
  - path: skills/browser-skill
    upstream: https://github.com/Tencent/BrowserSkill
    subdir: crates/bsk-cli/skill          # 上游技能真身所在目录（monorepo 内）
    ref: e1f125ce4d5a4ab53962de1fa2bf902f7feda80f
    snapshot: 2026-11-10
    files: 14
    layout: SKILL.md + references/         # 上游 2026-11 由单文件改为 主体 + references
    note: 上游直取；升版用 python tools/check_vendor.py --pull（会回写 ref / snapshot / files）
