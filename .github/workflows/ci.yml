name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 仓库不变量
        run: python -m pytest tests -q

      - name: 外部技能来源与完整性（离线，不联网）
        run: python tools/check_vendor.py

      - name: run 产物自洽（本机运行时用；CI 上没有 runs/，秒过）
        run: python tools/validate_run.py --all

      - name: Python 语法检查
        run: python -m compileall -q tools tests

      - name: Markdown 相对链接
        run: python tools/check-links.py
